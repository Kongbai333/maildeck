# MailDeck · Nginx 反向代理（HTTPS + HTTP/2）
#
# 为什么要开 HTTP/2：浏览器对 HTTP/1.1 的「同一 origin」最多 6 条连接，
# 「全部预览」要同时拉多路直播流时会被卡在第 7 路（表现是黑屏、无报错）。
# 开 h2 后浏览器用一条连接多路复用，预览才能真正同时出画面。
#
# 用法：
#   1) 证书：certbot certonly --nginx -d mail.example.com
#   2) 把本文件放到 /etc/nginx/conf.d/maildeck.conf，改域名与证书路径
#   3) nginx -t && systemctl reload nginx

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name mail.example.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # 关键：http2
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name mail.example.com;

    ssl_certificate     /etc/letsencrypt/live/mail.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 32m;

    # 直播流代理：必须关缓冲、放宽超时，否则会一直「加载中」
    location /api/me/online-play/stream {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_request_buffering off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
}
