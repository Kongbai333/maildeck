services:
  maildeck:
    image: ghcr.io/kongbai333/maildeck:latest
    # 需要本地自行构建时把上面 image 注释、启用下面 build：
    # build:
    #   context: .
    container_name: maildeck
    restart: unless-stopped
    pull_policy: always
    ports:
      - "8787:8787"
    environment:
      MAILDECK_HOST: "0.0.0.0"
      MAILDECK_PORT: "8787"
      MAILDECK_DATA_DIR: "/data"
      # 以下敏感项通过同目录 .env 注入（不要写死在这里、不要提交 .env）
      MAILDECK_MASTER_KEY: "${MAILDECK_MASTER_KEY:?请在 .env 设置 32 字节 base64 主密钥}"
      MAILDECK_ADMIN_USERNAME: "${MAILDECK_ADMIN_USERNAME:-admin}"
      MAILDECK_ADMIN_PASSWORD: "${MAILDECK_ADMIN_PASSWORD:?请在 .env 设置管理员初始密码}"
      # 可选：旧的单 Token 接口（等价管理员）
      # MAILDECK_API_TOKEN: "${MAILDECK_API_TOKEN:-}"
    volumes:
      - maildeck-data:/data

volumes:
  maildeck-data:
