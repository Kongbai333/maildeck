[package]
name = "maildeck-desktop"
version = "0.3.1"
description = "MailDeck Tauri 2 desktop shell (WebView2 + Node sidecar)"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "maildeck_desktop_lib"
# Windows 桌面只需要 rlib（bin 链接）+ staticlib；cdylib 会生成巨型 DLL 导出表，
# MinGW ld 在 GNU 目标下会报 export ordinal too large。
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
base64 = "0.22"

[features]
# `cargo tauri build` 由 CLI 自动启用；本地 cargo check 时可手动 --features custom-protocol。
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
panic = "abort"
